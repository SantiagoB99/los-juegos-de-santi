<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Los Juegos de Santi</title>
    <script>
      // Redirect preserving the hash for HashRouter
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 2).join('/') + '/' +
        (l.pathname.slice(1) ? '?p=' + encodeURIComponent(l.pathname.slice(1) + l.search) : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
